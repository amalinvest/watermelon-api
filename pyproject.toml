[project]
name = "watermelon-api"
version = "0.1.0"
description = "Flask API that retrieves, decodes, and enriches data from the Watermelon Index"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "gunicorn==21.2.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-cov>=4.1.0",
    "requests-mock>=1.11.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers --disable-warnings --cov=. --cov-report=term-missing --cov-report=html:htmlcov"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "external: Tests that require external services",
]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]
